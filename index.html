<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOLY TRIAL</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- High-priority opening assets: surveillance video and opening plates -->
    <link
      rel="preload"
      as="video"
      href="/cinematic/cctv_surveillance_archive.mp4"
      type="video/mp4"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/cinematic/cctv_archive_empty.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/cinematic/shot6_desk_overview.jpg" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-[#111315] text-[#E5DED0] antialiased selection:bg-[#782F37]/30 selection:text-[#E5DED0]"
  >
    <div id="root">
      <!-- Loading veil: replaced wholesale when React mounts. Static, palette-
           correct (matches the app's #111315 world) — no blank flash, no idle glow. -->
      <div
        id="loading-veil"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #111315;
          z-index: 9999;
        "
      >
        <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem">
          <div
            style="
              width: 2px;
              height: 64px;
              background: linear-gradient(
                to bottom,
                rgba(229, 222, 208, 0.25),
                rgba(198, 161, 107, 0.45)
              );
            "
          ></div>
          <span
            style="
              font-family: 'IBM Plex Mono', monospace;
              font-size: 0.7rem;
              letter-spacing: 0.4em;
              color: rgba(156, 148, 138, 0.6);
              text-transform: uppercase;
            "
            >HOLY TRIAL</span
          >
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
